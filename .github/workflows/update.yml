# 週1回、公演情報を集め直して docs/concerts.json を更新する
name: 公演情報を更新

on:
  schedule:
    # 毎週月曜 朝6時（日本時間）= 日曜 21:00（UTC）
    - cron: "0 21 * * 0"
  # GitHubの画面から手動でも実行できるようにする
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリを入れる
        run: pip install -r requirements.txt

      - name: 公演情報を集める
        env:
          TZ: Asia/Tokyo
        run: python scraper/main.py

      - name: 変わっていたら保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/concerts.json
          git diff --cached --quiet || git commit -m "公演情報を更新"
          git push
