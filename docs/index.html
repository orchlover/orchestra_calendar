<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>芸術</title>
  <meta name="description" content="オーケストラの定期演奏会と、美術館の企画展のカレンダー">

  <!-- iPhoneのホーム画面に追加したとき、アプリのように表示するための設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- black：ステータスバー（時刻・電池）の下からページを始める。重なって白っぽくなるのを防ぐ -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="芸術">
  <meta name="theme-color" content="#1b2340">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="style.css?v=14">
  <!-- 古いiPhone向け：ホーム画面から開いたことを印にする（上の青いバーを伸ばすため） -->
  <script>if (navigator.standalone) document.documentElement.classList.add("standalone");</script>
</head>
<body>
  <header class="app-header">
    <!-- 1段目：左は空き・真ん中にタイトル・右に切り替え（重ならないように3列に分ける） -->
    <div class="header-row">
      <span></span>
      <h1>芸術</h1>
      <!-- オケ／美 の切り替え -->
      <div class="mode-switch" role="tablist" aria-label="表示の切り替え">
        <button type="button" role="tab" data-mode="orch" aria-selected="true">オケ</button>
        <button type="button" role="tab" data-mode="art" aria-selected="false">美</button>
      </div>
    </div>
    <p class="updated" id="updated"></p>
    <p class="updated" id="art-updated" hidden></p>
  </header>

  <!-- ===== オケ：定期演奏会カレンダー ===== -->
  <main id="view-orch">
    <!-- 表示するオーケストラの切り替え -->
    <section class="filters" id="filters" aria-label="表示するオーケストラ"></section>

    <!-- 月カレンダー -->
    <section class="calendar-card">
      <div class="month-nav">
        <button type="button" id="prev" aria-label="前の月">‹</button>
        <h2 id="month-title"></h2>
        <button type="button" id="next" aria-label="次の月">›</button>
      </div>
      <div class="weekdays">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- 公演の一覧（日付を選ぶとその日だけ） -->
    <section class="list-section">
      <div class="list-head">
        <h2 id="list-title"></h2>
        <button type="button" class="show-all" id="show-all" hidden>月全体を表示</button>
      </div>
      <div id="list"></div>
    </section>

    <!-- チケット発売のお知らせ -->
    <section class="sales-section">
      <h2>🎫 チケット発売のお知らせ</h2>
      <div id="sales"></div>
    </section>
  </main>

  <!-- ===== 美：企画展の1年カレンダー ===== -->
  <main id="view-art" hidden>
    <section class="filters" id="art-filters" aria-label="表示する美術館"></section>
    <div id="gogh-banner"></div>
    <section class="gantt-card">
      <div class="gantt-months" id="gantt-months"></div>
      <div id="gantt"></div>
    </section>
  </main>

  <footer class="app-footer" id="art-footer" hidden>
    <p>各美術館の公式サイトの情報を週1回自動で集めています。企画展だけを載せています。会期や休館日は変わることがあるので、出かける前に必ず公式サイトで確認してください。</p>
  </footer>

  <footer class="app-footer" id="orch-footer">
    <p>各オーケストラ公式サイトの情報を週1回自動で集めています。出演者の変更などが反映されていないことがあるので、チケット購入前に必ず公式サイトで確認してください。</p>
    <p>発売日は一般発売日（会員先行ではない日）です。</p>
  </footer>

  <script src="app.js?v=14"></script>
  <script src="art.js?v=14"></script>
</body>
</html>
